name: Build Newflasher (Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mingw-w64 + make
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Build newflasher.exe
        run: make newflasher.exe

      - name: Verify output
        run: file newflasher.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: newflasher-windows-x64
          path: newflasher.exe
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: newflasher.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
